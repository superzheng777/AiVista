spring:
  application:
    name: aivista
  rabbitmq:
    # 填写 RabbitMQ 服务器公网 IP 或域名；填写完成后再将 app.generation.queue.enabled 改为 true。
    host: "118.31.236.251"
    port: 5672
    # 当前约定使用 RabbitMQ 独立业务账号；如服务端账号不同，请一并修改。
    username: aivista
    # 密码含 #、: 等 YAML 特殊字符时必须保留引号。
    password: "8bm4OU6W5DqnaT0YteR+x999A+j7/ZHWCysvM4nsVzE="
    # RabbitMQ 的逻辑隔离空间，需与服务器上创建的业务虚拟主机完全一致。
    virtual-host: /aivista
    connection-timeout: 5s
    publisher-confirm-type: correlated
  datasource:
    url: ${AIVISTA_DB_URL:jdbc:mysql://localhost:3306/aivista?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${AIVISTA_DB_USERNAME:root}
    password: ${AIVISTA_DB_PASSWORD:1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8888
  servlet:
    context-path: /api

app:
  cors:
    # 多个来源以英文逗号分隔；生产环境请配置为实际前端域名。
    allowed-origins: ${AIVISTA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-token-bytes: 32
    jwt:
      # 仅用于本地开发；生产环境必须通过 AIVISTA_JWT_SECRET 覆盖。
      secret: ${AIVISTA_JWT_SECRET:aivista-local-development-jwt-secret-change-before-production}
    cookie:
      name: refresh_token
      path: /api/auth
      secure: ${AIVISTA_COOKIE_SECURE:false}
      same-site: Lax
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 16384
      iterations: 2
    session-cleanup:
      enabled: true
      retention: 7d
      batch-size: 500
      max-batches: 10
      fixed-delay-ms: 3600000
  generation:
    queue:
      # 当前所有开发配置统一维护在本文件；未配置 RabbitMQ 时保持 false，避免启动分发器。
      enabled: true
      name: generation.task.execute
      consumer-concurrency: 30
      dispatcher-fixed-delay: 1s
      dispatcher-batch-size: 20
      delivery-max-retries: 5
      delivery-retry-delay: 5s
      queue-timeout: 5m
      queue-timeout-fixed-delay: 30s
    bailian:
      # 填写百炼目标业务空间的完整 HTTPS Endpoint，不在代码中拼接 WorkspaceId。
      endpoint: "https://ws-e17x0nhbbkvjv0it.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
      # 仅后端使用，不得记录到日志、文档或返回给客户端。
      api-key: "sk-ws-H.EIEREEL.r6Qd.MEUCIQCb41rZsCH4cO5-eykkaGMvFBJ_0s9Y5RgRBIqzoC_rlgIgHVRVWXsIMoic3NOUmhlOwET5ieeQDgGSsbCmWPavAgA"
      connect-timeout: 5s
      read-timeout: 300s
      max-concurrent-calls: 30
      rate-limit-per-second: 2
    oss:
      # 开发环境的地域 Endpoint；请按实际 Bucket 所在地域填写。
      endpoint: "oss-cn-hangzhou.aliyuncs.com"
      bucket: "zdy-aivista-dev"
      # 使用独立 RAM 身份的凭证，仅后端使用。
      access-key-id: "LTAI5t9XpzVAbcHo2dhrJsST"
      access-key-secret: "RlmVzjxIycLqQrzsEHriD0dhJpVhbq"
      object-prefix: users
      signed-url-ttl: 10m
      connect-timeout: 5s
      read-timeout: 60s
      max-object-size: 30MiB
    task:
      model: bailian/qwen-image-2.0
      max-active-tasks-per-user: 4
      daily-image-quota: 12
      max-prompt-code-points: 1000
      max-negative-prompt-code-points: 500
      min-image-count: 1
      max-image-count: 6
      aspect-ratios:
        "1:1": "2048*2048"
        "16:9": "2688*1536"
        "9:16": "1536*2688"
        "4:3": "2368*1728"
        "3:4": "1728*2368"
    consent:
      policy-version: 2026-07-27-v1
      policy-content: |-
        第三方数据处理说明

        为向你提供文生图服务，AiVista 需要将本次生成所需的信息发送至阿里云百炼服务处理。请在提交生成任务前阅读并确认本说明。

        一、处理目的
        AiVista 使用阿里云百炼的图像生成能力，根据你提交的提示词生成图片，并在同一创作会话中使用必要的历史提示词作为生成上下文。

        二、处理的信息
        本次生成可能发送你本次填写的正向提示词、负向提示词、当前创作会话中为生成本次图片所需的历史正向和负向提示词，以及图片数量、画面尺寸等生成参数。请不要在提示词中输入密码、身份证号、银行卡号、精确住址、联系方式、医疗健康信息或其他敏感个人信息。

        三、接收方与处理方式
        接收方为阿里云百炼服务。AiVista 后端通过接口将上述生成所需内容发送至阿里云百炼，由其完成图像生成。AiVista 不会向其提供你的登录密码、Refresh Token 或 Access Token。

        四、AiVista 的保存方式
        AiVista 会保存生成会话中的提示词、生成任务记录和生成结果图片，以便你后续查看生成记录。生成结果会保存到 AiVista 使用的私有对象存储中。当前版本暂未提供自助删除入口；如需删除相关生成记录，请通过后续公布的联系渠道提出申请。

        五、你的选择
        你可以选择不同意本说明，但将无法使用文生图功能。你可以在后续版本通过设置或联系渠道撤回同意；撤回不影响撤回前已经完成的处理活动，但会停止后续文生图请求。

        六、规则更新
        如果处理目的、处理方式、处理的信息类型或接收方发生变化，AiVista 会展示更新后的说明，并在你重新确认后继续提供文生图服务。

# springdoc-openapi：生成 OpenAPI 3 接口描述。
springdoc:
  # OpenAPI JSON 描述文件的访问路径：/api/v3/api-docs。
  api-docs:
    path: /v3/api-docs
  # Swagger UI 的访问路径：/api/swagger-ui.html（Knife4j 页面为 /api/doc.html）。
  swagger-ui:
    path: /swagger-ui.html
  # 接口分组。后续可按用户端、管理端等业务拆分为多个分组。
  group-configs:
    - group: default # 文档分组名称，会显示在 Knife4j 的分组列表中。
      packages-to-scan: com.superz.aivista # 扫描各业务模块的 api 包中的 Controller。

# Knife4j：OpenAPI 文档的增强 UI 配置。
knife4j:
  enable: true # 启用 Knife4j 增强功能与 /doc.html 页面。
  setting:
    language: zh_cn # Knife4j UI 使用简体中文。
